<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <link rel="stylesheet" th:href="@{/global.css(v=1)}">
    <title>Cadastro de Produtos - Estilo London Store</title>
    <link rel="icon" type="image/png" href="/Gemini_Generated_Image_kujj8zkujj8zkujj-removebg-preview.png">
</head>
 
<body>
 
    <!-- Barra de anúncios -->
    <div th:replace="~{fragments/anuncios :: anuncios}"></div>
 
    <!-- Barra branca com menu e busca -->
    <div class="barrabranca">
        <button class="menu-btn" id="menuBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>
 
        <form class="search-form" onsubmit="return false;">
            <input type="text" id="filtro" placeholder="Pesquisar produto cadastrado...">
            <button type="submit">Buscar</button>
        </form>
    </div>
 
    <main class="cadastro-container">
 
        <!-- Mensagens de retorno -->
        <div th:if="${sucesso}" class="cadastro-alerta cadastro-alerta-ok" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="cadastro-alerta cadastro-alerta-erro" th:text="${erro}"></div>
 
        <!-- Formulário de cadastro -->
        <section class="cadastro-form-box">
            <h2>Cadastrar novo produto</h2>
 
            <form th:action="@{/admin/produtos}" method="post" enctype="multipart/form-data" class="cadastro-form">
 
                <div class="cadastro-campo">
                    <label for="nome">Nome do produto</label>
                    <input type="text" id="nome" name="nome" maxlength="120" required>
                </div>
 
                <div class="cadastro-campo">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" name="preco" step="0.01" min="0" required>
                </div>
 
                <div class="cadastro-campo cadastro-campo-imagem">
                    <label for="imagem">Imagem</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*">
                    <img id="previa" class="cadastro-previa" alt="Prévia da imagem" hidden>
                </div>
 
                <button type="submit" class="btn-comprar cadastro-btn-salvar">Salvar produto</button>
            </form>
        </section>
 
        <!-- Grid de produtos já cadastrados -->
        <section>
            <div class="cadastro-titulo">
                <h2>Produtos cadastrados</h2>
                <span class="cadastro-contador" th:text="${#lists.size(listaProdutos)} + ' no total'"></span>
            </div>
 
            <p class="cadastro-vazio" th:if="${#lists.isEmpty(listaProdutos)}">
                Nenhum produto cadastrado ainda. Use o formulário acima para adicionar o primeiro.
            </p>
 
            <div class="produtos-grid" id="gridProdutos">
                <div th:each="produto : ${listaProdutos}" class="produto-card" th:attr="data-nome=${#strings.toLowerCase(produto.nome)}">
                    <img th:src="${produto.imagem != null} ? @{'/img/' + ${produto.imagem}} : 'https://placehold.co/400x500/ffb6c1/ffffff?text=Sem+foto'"
                         th:alt="${produto.nome}" alt="Produto">
 
                    <h3 th:text="${produto.nome}"></h3>
                    <p class="preco" th:text="${produto.preco}"></p>
 
                    <div class="cadastro-acoes-card">
                        <a th:href="@{'/detalhes/' + ${produto.id}}" class="btn-comprar">Ver</a>
 
                        <form th:action="@{'/admin/produtos/' + ${produto.id} + '/excluir'}" method="post"
                              onsubmit="return confirm('Excluir este produto?');">
                            <button type="submit" class="cadastro-btn-excluir">Excluir</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
 
    <div class="sidebar" id="sidebar">
        <nav>
            <a th:href="@{/home}">Início</a>
            <a th:href="@{/admin/produtos}">Produtos</a>
            <a href="#">Configurações</a>
            <a th:href="@{/logout}">Sair</a>
        </nav>
    </div>
    <div class="overlay" id="overlay"></div>
 
    <script th:src="@{/jshome.js(v=4)}"></script>
    <script>
        // Filtra os cards já cadastrados pela barra de pesquisa
        const filtro = document.getElementById('filtro');
        filtro.addEventListener('input', () => {
            const termo = filtro.value.trim().toLowerCase();
            document.querySelectorAll('#gridProdutos .produto-card').forEach(card => {
                card.style.display = card.dataset.nome.includes(termo) ? '' : 'none';
            });
        });
 
        // Prévia da imagem escolhida
        const input = document.getElementById('imagem');
        const previa = document.getElementById('previa');
        input.addEventListener('change', () => {
            const arquivo = input.files[0];
            if (!arquivo) { previa.hidden = true; return; }
            previa.src = URL.createObjectURL(arquivo);
            previa.hidden = false;
        });
    </script>
</body>
</html>
