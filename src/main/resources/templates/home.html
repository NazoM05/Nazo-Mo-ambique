<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">



    <link rel="stylesheet" th:href="@{/homecss.css(v=4)}">

    <title>Estilo London Store</title>

    <link rel="icon" type="image/png" href="/Gemini_Generated_Image_kujj8zkujj8zkujj-removebg-preview.png">

</head>





<body>





    <!-- Barra de anúncios -->
    <div th:replace="~{fragments/anuncios :: anuncios}"></div>

    <!-- Barra branca com menu e busca -->
    <div class="barrabranca">

    <button class="menu-btn" id="menuBtn">

        <span></span>

        <span></span>

        <span></span>

    </button>

    <form class="search-form" action="#" method="get">

        <input type="text" name="search" placeholder="Pesquisar...">

        <button type="submit">Buscar</button>

        </form>

    </div>


    <main class="container-produtos">

    <div class="produtos-grid">

        <div th:each="produto : ${listaProdutos}" class="produto-card">

            <img th:src="${produto.imagem != null} ? @{'/img/' + ${produto.imagem}} : 'https://placehold.co/400x500/ffb6c1/ffffff?text=Sem+foto'" th:alt="${produto.nome}" alt="Produto">

            <h3 th:text="${produto.nome}"></h3>

            <p class="preco" th:text="${produto.preco}"></p>

            <button th:onclick="|window.location.href='/detalhes/' + ${produto.id}|" class="btn-comprar">Ver Detalhes</button>


        </div>

    </div>

</main>

    <div class="sidebar" id="sidebar">

        <nav>

            <a href="#">Início</a>

            <a href="#">Perfil</a>

            <a href="#">Configurações</a>

            <a href="#">Sair</a>

        </nav>

    </div>

    <div class="overlay" id="overlay"></div>

    <script th:src="@{/jshome.js(v=4)}"></script>



</body>

</html>
