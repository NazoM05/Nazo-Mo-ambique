spring.application.name=nazomocambique

# Basic in-memory H2 configuration
spring.datasource.url=jdbc:h2:mem:nmb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enables the H2 Web Console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Garante a ordem: 1Âº Hibernate cria as tabelas -> 2Âº Roda o data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
